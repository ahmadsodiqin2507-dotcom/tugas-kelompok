<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pinjaman Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>💰 Pinjaman Online</h1>
                <p>Platform Pinjaman Uang Cepat dan Aman</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Masukkan username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Masukkan password">
                </div>

                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <div class="demo-section">
                <h4>Demo Account:</h4>
                <div class="demo-account">
                    <p><strong>Admin:</strong></p>
                    <p>Username: <code>admin</code></p>
                    <p>Password: <code>admin123</code></p>
                </div>
                <div class="demo-account">
                    <p><strong>User 1:</strong></p>
                    <p>Username: <code>john</code></p>
                    <p>Password: <code>john123</code></p>
                </div>
                <div class="demo-account">
                    <p><strong>User 2:</strong></p>
                    <p>Username: <code>jane</code></p>
                    <p>Password: <code>jane123</code></p>
                </div>
            </div>

            <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            
            const user = DB.login(username, password);
            
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                if (user.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } else {
                errorMsg.textContent = 'Username atau password salah';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
